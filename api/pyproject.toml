[project]
name = "gym-api"
version = "0.1.0"
description = "Strength-training log backend (FastAPI, SQLAlchemy, SQLite/WAL)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23",
    # Wired in later phases:
    #   phase 3 (API/auth): fastapi, uvicorn[standard], pydantic-settings, pyjwt
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
