# Registro de fuerza — served under /gym/, OPEN (no client-cert/token gate):
# the app protects itself with its own JWT login. Included inside the existing
# 443 server block for your-server.

# API -> backend (nginx strips the /gym/api/ prefix via the trailing slash).
location /gym/api/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

# Static SPA (built dist), with client-side-routing fallback to index.html.
location /gym/ {
    alias /opt/gym/web/dist/;
    try_files $uri $uri/ /gym/index.html;
}
